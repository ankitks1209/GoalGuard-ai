name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend lint, typecheck, coverage and build
        run: npm run check
      - name: Save frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          # Explicit coverage files only; never upload the private .local directory.
          include-hidden-files: true
          path: |
            .local/checks/frontend-coverage/coverage-summary.json
            .local/checks/frontend-coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn
  browser:
    name: Browser accessibility and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked browser tools
        run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Accessibility, keyboard, reflow and screenshot comparisons
        run: npm run test:browser
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/goalguard-browser
          retention-days: 14
          if-no-files-found: warn
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Validate contributor contract and hook configuration
        run: |
          python -c "from pathlib import Path; assert len(Path('AGENTS.md').read_text().splitlines()) < 150; assert Path('CLAUDE.md').read_text() == '@AGENTS.md\n'"
          python -m pre_commit validate-config
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Run complete enforcement suite with branch coverage and TCP required
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: python -m coverage run evaluate.py --report "$RUNNER_TEMP/goalguard-eval.json" --require-tcp
      - name: Reject skipped or incomplete test evidence
        run: python scripts/check_test_report.py "$RUNNER_TEMP/goalguard-eval.json"
      - name: Enforce 80 percent coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage report
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"
      - name: Run synthetic probing experiment
        run: python probe_evaluate.py --report "$RUNNER_TEMP/goalguard-probing.json"
      - name: Run local demo
        run: python demo.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/goalguard-wheel"
          "$RUNNER_TEMP/goalguard-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/goalguard-wheel/bin/goalguard-server" --help
          "$RUNNER_TEMP/goalguard-wheel/bin/goalguard-demo"
          "$RUNNER_TEMP/goalguard-wheel/bin/python" -c 'import json; from importlib.resources import files; resources = files("goalguard").joinpath("resources"); assert resources.joinpath("plan-draft.txt").read_text().strip(); assert isinstance(json.loads(resources.joinpath("plan-draft.schema.json").read_text()), dict)'
      - name: Save evaluation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/goalguard-eval.json
            ${{ runner.temp }}/goalguard-probing.json
            ${{ runner.temp }}/coverage.xml
          retention-days: 14
          if-no-files-found: warn
