[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goalguard-ai"
version = "0.1.0"
description = "Goal-aware budget and payment controls for AI shopping agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
  "mypy>=1.16,<3",
  "coverage[toml]>=7.9,<8",
  "pre-commit>=4,<5",
]

[project.urls]
Repository = "https://github.com/ankitks1209/GoalGuard-ai"
Documentation = "https://github.com/ankitks1209/GoalGuard-ai/tree/main/docs"
Issues = "https://github.com/ankitks1209/GoalGuard-ai/issues"

[project.scripts]
goalguard-server = "server:main"
goalguard-demo = "demo:main"

[tool.setuptools]
packages = ["goalguard", "goalguard.resources"]
py-modules = ["server", "demo", "evaluate", "probe_evaluate"]

[tool.setuptools.package-data]
goalguard = ["resources/*.txt", "resources/*.json"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".local", "build", "dist"]

[tool.ruff.lint]
# Correctness checks first; adopting formatting would create unrelated churn.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["goalguard", "server.py", "demo.py", "agent.py", "draft_plan.py", "evaluate.py", "probe_evaluate.py", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
explicit_package_bases = true

[tool.coverage.run]
branch = true
source = ["."]
data_file = ".local/checks/.coverage"

[tool.coverage.report]
include = ["goalguard/*.py", "server.py", "demo.py", "agent.py", "draft_plan.py"]
fail_under = 80
show_missing = true
precision = 2

[tool.coverage.xml]
output = ".local/checks/coverage.xml"
